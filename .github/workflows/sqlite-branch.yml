name: Device Bridge SQLite branch (Python 3.9)

on:
  push:
    branches: ["feature/sqlite-full-migration"]
  workflow_dispatch:

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: SQLite migration, API, domain regression
        run: >-
          python -m pytest -q
          tests/test_data_store.py
          tests/test_storage_legacy_import.py
          tests/test_package_layout.py
          tests/test_orm_normalize.py
          tests/test_orm_repository.py
          tests/test_orm_operational.py
          tests/test_orm_history.py
          tests/test_orm_cutover.py
          tests/test_sqlite_admin.py
          tests/test_temperature_calibration.py
          tests/test_python_runtime.py
          tests/test_recipe_engine.py
          tests/test_device_runtime.py
          tests/test_panel.py
