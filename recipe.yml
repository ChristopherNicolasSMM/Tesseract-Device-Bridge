# Exemplo de receita autônoma — não depende de MQTT/Tesseract para
# rodar. Copie para recipe.yml na raiz do projeto (mesmo diretório de
# devices.yml) para o run_bridge.py carregar automaticamente.
#
# Referências de device_id (heater_device_id, sensor_device_id, pumps)
# precisam existir no devices.yml carregado — validado no boot.

name: "Lagers da Casa"

vessels:
  01_mash:
    label: Mash
    heater_device_id: mash_heater
    sensor_device_id: mash_tun_temp
    pid:
      kp: 5.0
      ki: 0.1
      kd: 0.0
    window_seconds: 10   # janela de time-proportioning (liga/desliga) — ver README

  02_boil:
    label: Boil
    heater_device_id: boil_heater
    sensor_device_id: boil_temp
    pid:
      kp: 4.0
      ki: 0.05
      kd: 0.0
    window_seconds: 10

steps:
  - vessel: 01_mash
    label: "Mostura - Beta-Amilase"
    target_temp: 67
    hold_minutes: 40
    pumps: [pump_b1]   # recirculação durante a mostura

  - vessel: 01_mash
    label: "Mostura - Alfa-Amilase"
    target_temp: 67
    hold_minutes: 20
    pumps: [pump_b1]   # recirculação durante a mostura    

  - vessel: 01_mash
    label: "Mostura - Mash Out"
    target_temp: 75
    hold_minutes: 15
    pumps: [pump_b1]   # recirculação durante a mostura
 
  - vessel: 02_boil
    label: "Fervura"
    target_temp: 100
    hold_minutes: 60
    pumps: [pump_b2]   # whirlpool/chiller na fervura
