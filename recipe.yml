# Receita real do usuário (migrada para o schema id/name/order em
# 2026-06-30, durante a sessão que introduziu o campo `order` —
# substitui o prefixo manual "01_"/"02_" usado antes pra ordenação).

name: "Lagers da Casa"

vessels:
  - id: mash
    name: "Mash"
    order: 0
    heater_device_id: mash_heater
    sensor_device_id: mash_tun_temp
    pid:
      kp: 5.0
      ki: 0.1
      kd: 0.0
    window_seconds: 10   # janela de time-proportioning (liga/desliga) — ver README

  - id: boil
    name: "Boil"
    order: 1
    heater_device_id: boil_heater
    sensor_device_id: boil_temp
    pid:
      kp: 4.0
      ki: 0.05
      kd: 0.0
    window_seconds: 10

steps:
  - vessel: mash
    label: "Mostura - Beta-Amilase"
    target_temp: 67
    hold_minutes: 40
    pumps: [pump_b1]   # recirculação durante a mostura

  - vessel: mash
    label: "Mostura - Alfa-Amilase"
    target_temp: 67
    hold_minutes: 20
    pumps: [pump_b1]   # recirculação durante a mostura

  - vessel: mash
    label: "Mostura - Mash Out"
    target_temp: 75
    hold_minutes: 15
    pumps: [pump_b1]   # recirculação durante a mostura

  - vessel: boil
    label: "Fervura"
    target_temp: 100
    hold_minutes: 60
    pumps: [pump_b2]   # whirlpool/chiller na fervura
