[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-reusable-tools"
version = "0.1.0"
description = "Independent serial monitor and guided installer building blocks"
requires-python = ">=3.9"

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
wizard = ["Flask>=3.0,<3.2", "python-dotenv>=1,<2"]

[tool.setuptools]
packages = ["reusable", "reusable.serial_monitor", "reusable.guided_setup"]
package-dir = {reusable = "."}

[tool.setuptools.package-data]
"reusable.guided_setup" = ["templates/guided_setup/*.html", "static/*.css"]
